# On every push to main, regenerate chaos-db.json from committed data (no ROM) and
# land it on the chaos-data branch, so the hosted viewer and the tangos.dev card
# self-update. Mirrors sm64ds-decomp's workflow, trimmed to the data publish plus the
# README progress bar (no treemap / provenance yet - those still need the ROM tooling).
#
# The chaos-data branch must already exist (seeded once as an orphan branch holding
# chaos-db.json). tangos.dev's romstats-sync reads chaos-db.json's `stats` block from
# that branch to publish /api/rom-stats.
#
# It also refreshes contributions.json on MAIN. That file is per-contributor career
# match totals, and tangos.dev's match coin ledger credits the DELTA between it and
# what it last paid - so a match only ever earns its author coins once this file has
# moved. It lands on main rather than chaos-data because it is a committed fact about
# the repo, and because the ledger reads it from the default branch.
name: update-chaos-data

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "tools/chaos_db_ci.py"
      - "tools/progress.py"
      - ".github/workflows/update-chaos-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chaos-data
  cancel-in-progress: true

jobs:
  regen:
    runs-on: ubuntu-latest
    # The refresh commit lands on chaos-data, not main, so it never retriggers this
    # workflow - but guard anyway, cheap insurance against a loop.
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, NOT the default shallow clone. chaos_db_ci.py resolves match
          # authorship by replaying every commit that touched src/, so at depth 1 it sees
          # one commit and credits every match in the repo to whoever pushed last. That
          # fails silently - the file still generates, with the wrong names in it.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: chaos-data
          path: _chaos_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate chaos-db.json + contributions.json (committed data only, no ROM)
        run: |
          python tools/chaos_db_ci.py \
            --out _chaos_data/chaos-db.json \
            --contrib-out contributions.json
      - name: Push progress data if changed
        run: |
          cd _chaos_data
          if git diff --quiet -- chaos-db.json; then
            echo "no data change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          git add chaos-db.json
          git commit -m "Refresh progress data from $(git -C .. rev-parse --short HEAD)"
          # Two PRs merging seconds apart start this job twice, and cancel-in-progress only
          # kills the older run if it has not reached this step yet. Past that point both runs
          # push and the loser is rejected, because chaos-data moved under it. The run then
          # goes red having published nothing, so the matches that just merged stay off the
          # viewer until some later merge happens to republish them.
          #
          # So retry onto the moved branch. If it moved because another run already republished
          # chaos-db.json, that run read a newer main than this one did and its file is the
          # better one - stand down rather than overwrite it with older data.
          for attempt in 1 2 3; do
            if git push origin chaos-data; then exit 0; fi
            git fetch -q origin chaos-data
            if ! git diff --quiet "$base" FETCH_HEAD -- chaos-db.json; then
              echo "another run already published newer data - standing down"; exit 0
            fi
            echo "chaos-data moved under the push - rebasing (attempt $attempt)"
            git rebase FETCH_HEAD || { echo "rebase onto the moved branch failed"; exit 1; }
          done
          echo "chaos-data kept moving - could not land chaos-db.json"; exit 1
      - name: Refresh the README progress bar (committed data only, no ROM)
        # Both halves of the fraction are committed: the matched count is the src/arm{9,7}
        # file count, and the total comes from config/**/symbols.txt, which
        # tools/gen_symbols.py commits precisely so this can run without the ROM.
        #
        # It used to be a manual local step, and manual meant stale: main had 651 matched
        # functions while the badge on the front page still read 301, understating the
        # project by 350 functions and roughly 4x on bytes for two days.
        run: python tools/progress.py --write-readme
      - name: Push contributions.json and the README bar if changed
        # Separate from the chaos-db step above on purpose: an unchanged chaos-db.json exits
        # that step early, and these still have to be able to move on their own (a
        # re-attribution changes who holds a match without changing the totals).
        #
        # Both files ride one commit and one push. They almost always move together, and
        # two separate pushes to main would just race each other for no benefit.
        run: |
          if git diff --quiet -- contributions.json README.md; then
            echo "no contributor or progress change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          git add contributions.json README.md
          git commit -m "Refresh contributions and progress from $(git rev-parse --short HEAD)"
          # Safe from a retrigger loop twice over: a GITHUB_TOKEN push does not start
          # workflows, and neither contributions.json nor README.md is in the paths filter.
          #
          # Same race as the step above, and this one costs money rather than freshness: #76
          # and #88 merged twelve seconds apart, the first run's push was rejected because main
          # had moved, and contributions.json never moved with it. The coin ledger pays the
          # DELTA between this file and what it last paid, so a refresh that never lands is a
          # match that never earns its author anything. Retry onto the moved branch, and stand
          # down if another run already refreshed the file from a newer main than this one read.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch -q origin main
            if ! git diff --quiet "$base" FETCH_HEAD -- contributions.json README.md; then
              echo "another run already refreshed these from a newer main - standing down"; exit 0
            fi
            echo "main moved under the push - rebasing (attempt $attempt)"
            git rebase FETCH_HEAD || { git rebase --abort 2>/dev/null || true; echo "rebase onto the moved main failed"; exit 1; }
          done
          echo "main kept moving - could not land contributions.json"; exit 1
